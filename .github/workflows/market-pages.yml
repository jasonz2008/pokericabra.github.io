name: Publish Drawply and Pokericabra
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage public product files only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/product-site"
          cp index.html 404.html home.css home.js CNAME app-ads.txt privacy-policy.html terms-of-service.html delete-data.html "$RUNNER_TEMP/product-site/"
          cp -R assets drawply "$RUNNER_TEMP/product-site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/product-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
